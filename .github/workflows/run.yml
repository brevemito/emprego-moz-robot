name: Job Scraper Moçambique

on:
  workflow_dispatch:
  schedule:
    # Corre todos os dias às 03:00 UTC (05:00 em Moçambique, UTC+2),
    # para o site ter sempre vagas actualizadas logo de manhã.
    # O agendamento do GitHub Actions é sempre em UTC - se quiser mudar
    # a hora, subtraia 2 horas à hora desejada em Moçambique.
    - cron: "0 3 * * *"

# Evita que duas execuções corram ao mesmo tempo (ex.: se disparar
# manualmente enquanto a execução agendada ainda está a decorrer),
# o que poderia causar conflitos ao fazer commit do jobs.json.
concurrency:
  group: job-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper/main.py

      # Bolsas de estudo: script independente. "continue-on-error" faz com
      # que uma falha aqui nunca impeça a publicação das vagas.
      - name: Run bolsas de estudo
        if: always()
        continue-on-error: true
        run: python scraper/bolsas.py

      - name: Commit jobs.json, bolsas.json e páginas das vagas
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/jobs.json
          if [ -f data/bolsas.json ]; then git add data/bolsas.json; fi
          # Páginas por vaga (inclui as apagadas), sitemap e texto do canal.
          if [ -d docs/vagas ]; then git add -A docs/vagas; fi
          if [ -f docs/sitemap.xml ]; then git add docs/sitemap.xml; fi
          if [ -f docs/canal.html ]; then git add docs/canal.html; fi
          git commit -m "Update jobs.json, bolsas.json e páginas das vagas" || echo "No changes to commit"
          git push
